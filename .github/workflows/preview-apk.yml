name: Preview ARM64 APK
on:
  push:
    branches: [feature/iishko-termux-subagents]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare wrapper and SDK
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
          ls "$ANDROID_HOME/platforms"
      - name: Check Kotlin artifact availability
        run: |
          for base in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2; do
            curl -L -sS -o /dev/null -w '%{http_code} %{url_effective}\n' "$base/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/2.4.21/org.jetbrains.kotlin.plugin.compose.gradle.plugin-2.4.21.pom" || true
          done
      - name: Build ARM64 debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: md3-agent-arm64-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
