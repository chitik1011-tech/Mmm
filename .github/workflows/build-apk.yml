# vishna-agent CI
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename and validate APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vishna-agent-debug.apk
          unzip -t vishna-agent-debug.apk
          ls -lh vishna-agent-debug.apk
          sha256sum vishna-agent-debug.apk | tee vishna-agent-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vishna-agent-debug-apk
          path: |
            vishna-agent-debug.apk
            vishna-agent-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
